<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Upload a product photo and instantly discover real customer reviews, ratings, prices, and AI-powered insights. Evidence-based analysis from real customer data." />
    <meta name="theme-color" content="#060a14" />
    <title>Reviewly — Snap a Product. Know What Real Customers Say.</title>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: #060a14;
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      /* Ambient background glow */
      body::before {
        content: '';
        position: fixed;
        top: -40%;
        left: -20%;
        width: 80%;
        height: 80%;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, transparent 70%);
        pointer-events: none;
        animation: drift 12s ease-in-out infinite alternate;
      }
      body::after {
        content: '';
        position: fixed;
        bottom: -30%;
        right: -15%;
        width: 70%;
        height: 70%;
        background: radial-gradient(circle, rgba(168, 85, 247, 0.10) 0%, transparent 70%);
        pointer-events: none;
        animation: drift 10s ease-in-out infinite alternate-reverse;
      }

      @keyframes drift {
        from { transform: translate(0, 0); }
        to   { transform: translate(40px, 30px); }
      }

      .container {
        position: relative;
        z-index: 1;
        text-align: center;
        max-width: 520px;
        padding: 2.5rem;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 1.5rem;
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        animation: fadeUp 0.6s ease-out both;
      }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(24px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .logo {
        font-size: 2.8rem;
        margin-bottom: 0.3rem;
        animation: pulse 2.5s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.08); }
      }

      h1 {
        font-size: 1.75rem;
        font-weight: 700;
        background: linear-gradient(135deg, #818cf8, #c084fc, #f0abfc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 0.5rem;
      }

      .tagline {
        font-size: 0.95rem;
        color: #94a3b8;
        margin-bottom: 2rem;
        line-height: 1.5;
      }

      .links {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .link-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        padding: 0.9rem 1.5rem;
        border-radius: 0.85rem;
        font-size: 0.95rem;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.25s ease;
        cursor: pointer;
      }

      .link-btn.primary {
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: #fff;
        border: none;
        box-shadow: 0 4px 20px rgba(99, 102, 241, 0.35);
      }
      .link-btn.primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 28px rgba(99, 102, 241, 0.5);
      }

      .link-btn.secondary {
        background: rgba(255, 255, 255, 0.06);
        color: #c4b5fd;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .link-btn.secondary:hover {
        background: rgba(255, 255, 255, 0.10);
        border-color: rgba(139, 92, 246, 0.4);
        transform: translateY(-2px);
      }

      .status {
        margin-top: 1.75rem;
        padding-top: 1.25rem;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        font-size: 0.82rem;
        color: #64748b;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #facc15;
        animation: blink 1.5s ease-in-out infinite;
      }
      .status-dot.online { background: #34d399; animation: none; }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.3; }
      }

      .status-text { transition: color 0.3s; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">🛍️</div>
      <h1>Reviewly</h1>
      <p class="tagline">Snap a product. Know what real customers say.<br/>AI-powered reviews, sentiment, and price comparison.</p>

      <div class="links">
        <a id="app-link" href="http://localhost:5173" class="link-btn primary">
          🚀 Open Reviewly App
        </a>
        <a id="api-docs-link" href="http://localhost:8000/docs" class="link-btn secondary">
          📖 API Documentation
        </a>
        <a id="health-link" href="http://localhost:8000/api/v1/health" class="link-btn secondary">
          💓 API Health Check
        </a>
      </div>

      <div class="status">
        <span id="status-dot" class="status-dot"></span>
        <span id="status-text" class="status-text">Checking backend status…</span>
      </div>
    </div>

    <script>
      async function checkHealth() {
        const dot  = document.getElementById('status-dot');
        const text = document.getElementById('status-text');
        try {
          const res = await fetch('http://localhost:8000/api/v1/health', { signal: AbortSignal.timeout(4000) });
          if (res.ok) {
            const data = await res.json();
            dot.classList.add('online');
            text.textContent = `Backend online — SerpAPI: ${data.serpapi_configured ? '✓' : '✗'}  LLM: ${data.llm_configured ? '✓' : '✗'}`;
            text.style.color = '#94a3b8';
          } else {
            throw new Error('Not OK');
          }
        } catch {
          dot.classList.remove('online');
          text.textContent = 'Backend offline — start the server with: python -m uvicorn app.main:app --reload';
          text.style.color = '#f87171';
        }
      }

      checkHealth();
      setInterval(checkHealth, 10000);
    </script>
  </body>
</html>
