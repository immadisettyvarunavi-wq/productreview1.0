services:
  # Single Unified Service: Hosts both React SPA and FastAPI Backend on Render
  - type: web
    name: reviewly
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health
    envVars:
      - key: SERPAPI_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./reviewai.db
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MAX_FILE_SIZE_MB
        value: "10"
      - key: CACHE_TTL_HOURS
        value: "12"
      - key: PYTHON_VERSION
        value: "3.11.6"
